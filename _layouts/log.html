<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}Log · Sam (NotAsami)</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="theme-color" content="#14111e">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate" type="application/atom+xml" title="Sam's log" href="/log/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap" rel="stylesheet">
<script>let t;try{t=localStorage.theme}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');</script>
<link rel="stylesheet" href="/assets/log.css">
</head>
<body>
<div class="log">
  <header class="bar">
    <a class="home" href="/"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>notasami.dev</a>
    <a class="dymo" href="/log/">Log</a>
    <button class="theme" type="button" aria-label="Dark pages" aria-pressed="false">
      <svg class="icon i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <svg class="icon i-sun" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg>
    </button>
  </header>
  <main class="sheet">
    {{ content }}
  </main>
  <footer class="colophon">
    <span>© {{ site.time | date: '%Y' }} Sam · built and running</span>
    <a href="/log/feed.xml">RSS feed</a>
  </footer>
</div>
<script>
(() => {
  const root = document.documentElement, b = document.querySelector('.theme');
  const sync = () => b.setAttribute('aria-pressed', root.dataset.theme === 'dark');
  sync();
  b.addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.theme = root.dataset.theme; } catch (e) {}
    sync();
  });
})();
</script>
</body>
</html>
