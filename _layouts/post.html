---
layout: log
---
<article class="post">
  <p class="meta mono"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time></p>
  <h1>{{ page.title }}</h1>
  {% if page.tags.size > 0 %}<ul class="tags" aria-label="Tags">{% for tag in page.tags %}<li><span class="dymo">{{ tag }}</span></li>{% endfor %}</ul>{% endif %}
  <div class="prose">
    {{ content }}
  </div>
  <p class="back"><a href="/log/">← All entries</a></p>
</article>
